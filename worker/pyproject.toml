[project]
name = "flowblock-worker"
version = "0.1.0"
description = "Prompted product segmentation and image-space take measurements"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.1.3",
  "opencv-python-headless==4.10.0.84",
  "Pillow==11.0.0",
  "psycopg[binary]==3.2.3",
  "boto3==1.35.76",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "hydra-core==1.3.2",
  "iopath==0.1.10",
  "tqdm==4.67.1",
  "opentelemetry-sdk==1.38.0",
  "opentelemetry-exporter-otlp-proto-http==1.38.0",
]

[dependency-groups]
dev = ["pytest==8.3.4", "ruff==0.8.2"]

[project.scripts]
flowblock-worker = "flowblock_worker.cli:main"

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
