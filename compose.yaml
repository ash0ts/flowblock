name: flowblock
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: flowblock
      POSTGRES_DB: flowblock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:54379:5432"
    volumes:
      - flowblock-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowblock"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  flowblock-db:
